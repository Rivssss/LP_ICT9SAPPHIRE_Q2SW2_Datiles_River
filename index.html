<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Contact Information</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">

    <style>
        body {
            background: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQKlQZ6lD7bQZXk6yGRH6gus5kFU1c1H9X4xA&s) no-repeat center center/cover;
            background-attachment: fixed;
        }

        .content-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            margin-top: 25px;
        }

        table {
            background: white;
        }
    </style>
</head>
<body>

    
    <header class="py-4 text-center bg-dark text-white">
        <h1>Contact Us</h1>
    </header>

    <div class="container content-box">

        <div class="row g-4">
            
           
            <div class="col-12 col-lg-6">
                <h3 class="mb-3">Office Hours</h3>
                <table class="table table-bordered table-striped">
                    <thead class="table-primary">
                        <tr>
                            <th>Day</th>
                            <th>Office Hours</th>
                            <th>Department</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Monday</td>
                            <td>8:00 AM - 4:00 PM</td>
                            <td>Accounting Office</td>
                        </tr>
                        <tr>
                            <td>Tuesday</td>
                            <td>8:00 AM - 4:00 PM</td>
                            <td>Guidance Office</td>
                        </tr>
                        <tr>
                            <td>Wednesday</td>
                            <td>8:00 AM - 4:00 PM</td>
                            <td>Principal's Office</td>
                        </tr>
                        <tr>
                            <td>Thursday</td>
                            <td>8:00 AM - 4:00 PM</td>
                            <td>Admin's Office</td>
                        </tr>
                        <tr>
                            <td>Friday</td>
                            <td>8:00 AM - 3:00 PM</td>
                            <td>Registar's Office</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            
            <div class="col-12 col-lg-6">
                <h3 class="mb-3">Contact Us</h3>

                <form>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="Enter your name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" placeholder="Enter your phone number">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
                    </div>

                    <button class="btn btn-primary w-100">Send Message</button>
                </form>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
